lekiwi_kiwi_base_controller:
  ros__parameters:
    input_topic: /cmd_vel
    output_topic: /joint_command
    joint_names:
      - ST3215_Servo_Motor_v1_2_Revolute_60
      - ST3215_Servo_Motor_v1_1_Revolute_62
      - ST3215_Servo_Motor_v1_Revolute_64
    wheel_angles_deg: [0.0, 120.0, 240.0]
    wheel_radius: 0.055
    base_radius: 0.25
    publish_rate_hz: 100.0
    command_timeout: 0.5
    max_wheel_speed: 30.0
